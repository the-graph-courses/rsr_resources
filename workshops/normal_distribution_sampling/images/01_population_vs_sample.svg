<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="6" fill="#7fb3d5"/>
    </pattern>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="6" orient="auto">
      <path d="M0,0 L10,6 L0,12 Z" fill="#566573"/>
    </marker>
  </defs>

  <!-- Population -->
  <rect x="30" y="55" width="300" height="200" rx="16" fill="url(#dots)" stroke="#2e86c1" stroke-width="2"/>
  <text x="180" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b4f72">Population</text>
  <text x="180" y="280" text-anchor="middle" font-size="14" fill="#566573">all US full-term births, 2014</text>

  <!-- Arrow -->
  <line x1="350" y1="155" x2="430" y2="155" stroke="#566573" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="390" y="140" text-anchor="middle" font-size="13" fill="#566573">take a</text>
  <text x="390" y="178" text-anchor="middle" font-size="13" fill="#566573">sample</text>

  <!-- Sample -->
  <rect x="455" y="95" width="235" height="120" rx="14" fill="#fdfefe" stroke="#cb4335" stroke-width="2"/>
  <text x="572" y="78" text-anchor="middle" font-size="18" font-weight="bold" fill="#922b21">Sample</text>
  <text x="572" y="240" text-anchor="middle" font-size="14" fill="#566573">a handful of babies (n)</text>
  <g fill="#ec7063">
    <circle cx="490" cy="130" r="9"/>
    <circle cx="525" cy="130" r="9"/>
    <circle cx="560" cy="130" r="9"/>
    <circle cx="595" cy="130" r="9"/>
    <circle cx="630" cy="130" r="9"/>
    <circle cx="508" cy="175" r="9"/>
    <circle cx="543" cy="175" r="9"/>
    <circle cx="578" cy="175" r="9"/>
  </g>
</svg>
