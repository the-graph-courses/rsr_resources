<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" font-family="Helvetica, Arial, sans-serif">
  <text x="460" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Three purposes of multiple linear regression</text>
  <text x="460" y="50" text-anchor="middle" font-size="12.5" fill="#64748b">Same method, different scientific goals, different outputs</text>

  <rect x="30" y="70" width="270" height="230" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
  <rect x="30" y="70" width="270" height="48" rx="12" fill="#ea580c"/>
  <rect x="30" y="95" width="270" height="23" fill="#ea580c"/>
  <text x="165" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">1. Causal effect</text>
  <text x="165" y="145" text-anchor="middle" font-size="13" fill="#7c2d12">Estimate the effect of</text>
  <text x="165" y="165" text-anchor="middle" font-size="13" fill="#7c2d12">one exposure on Y</text>
  <text x="165" y="198" text-anchor="middle" font-size="12" fill="#9a3412">Choose covariates with</text>
  <text x="165" y="216" text-anchor="middle" font-size="12" fill="#9a3412">a DAG or confounder logic</text>
  <text x="165" y="246" text-anchor="middle" font-size="12" fill="#7c2d12">Typical output: crude to adjusted</text>
  <text x="165" y="264" text-anchor="middle" font-size="12" fill="#7c2d12">side-by-side model table</text>

  <rect x="325" y="75" width="270" height="220" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="325" y="75" width="270" height="44" rx="12" fill="#e2e8f0"/>
  <rect x="325" y="97" width="270" height="22" fill="#e2e8f0"/>
  <text x="460" y="103" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">2. Prediction</text>
  <text x="460" y="145" text-anchor="middle" font-size="13" fill="#334155">Predict Y for new</text>
  <text x="460" y="165" text-anchor="middle" font-size="13" fill="#334155">individuals accurately</text>
  <text x="460" y="200" text-anchor="middle" font-size="12" fill="#64748b">Choose predictors that</text>
  <text x="460" y="218" text-anchor="middle" font-size="12" fill="#64748b">improve out-of-sample fit</text>
  <text x="460" y="250" text-anchor="middle" font-size="12" fill="#475569">Typical output: RMSE, MAE,</text>
  <text x="460" y="268" text-anchor="middle" font-size="12" fill="#475569">predicted versus observed</text>

  <rect x="620" y="70" width="270" height="230" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="3.5"/>
  <rect x="620" y="70" width="270" height="48" rx="12" fill="#059669"/>
  <rect x="620" y="95" width="270" height="23" fill="#059669"/>
  <text x="755" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">3. Compare predictors</text>
  <text x="755" y="145" text-anchor="middle" font-size="13" fill="#064e3b">Which predictors remain</text>
  <text x="755" y="163" text-anchor="middle" font-size="13" fill="#064e3b">associated after mutual</text>
  <text x="755" y="181" text-anchor="middle" font-size="13" fill="#064e3b">adjustment?</text>
  <text x="755" y="210" text-anchor="middle" font-size="12" fill="#047857">Choose predictors thought</text>
  <text x="755" y="228" text-anchor="middle" font-size="12" fill="#047857">to be associated with Y</text>
  <text x="755" y="258" text-anchor="middle" font-size="12" fill="#047857">Typical output: one coefficient</text>
  <text x="755" y="276" text-anchor="middle" font-size="12" fill="#047857">table with adjusted estimates</text>
</svg>
