<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 230" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>

  <text x="460" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f766e">Week 9 workshop path</text>
  <text x="460" y="50" text-anchor="middle" font-size="12.5" fill="#64748b">From one univariable association, to mutual adjustment, then diagnostics</text>

  <rect x="45" y="82" width="240" height="125" rx="12" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
  <circle cx="72" cy="108" r="14" fill="#0e7490"/>
  <text x="72" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">1</text>
  <text x="165" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#155e75">Fit a single</text>
  <text x="165" y="126" text-anchor="middle" font-size="14" font-weight="bold" fill="#155e75">univariable model</text>
  <text x="165" y="168" text-anchor="middle" font-size="12" fill="#334155">Start with age alone</text>

  <rect x="340" y="82" width="240" height="125" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <circle cx="367" cy="108" r="14" fill="#d97706"/>
  <text x="367" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">2</text>
  <text x="460" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e">Build and interpret</text>
  <text x="460" y="126" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e">multiple regression</text>
  <text x="460" y="168" text-anchor="middle" font-size="12" fill="#334155">Age, sex, grade, residence, support</text>

  <rect x="635" y="82" width="240" height="125" rx="12" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <circle cx="662" cy="108" r="14" fill="#db2777"/>
  <text x="662" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">3</text>
  <text x="755" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#9d174d">Check model</text>
  <text x="755" y="126" text-anchor="middle" font-size="14" font-weight="bold" fill="#9d174d">assumptions</text>
  <text x="755" y="168" text-anchor="middle" font-size="12" fill="#334155">SUNSHINE and check_model()</text>

  <path d="M 289 145 L 336 145" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 584 145 L 631 145" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
</svg>
