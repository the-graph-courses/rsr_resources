<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One-Sample t-Test — The Cupcake Audit</title>
<style>
  :root{ --teal:#035f6c; --gold:#d4af33; --ink:#163030; }
  *{box-sizing:border-box;}
  body{margin:0;background:#eef3f3;color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;}
  .bar{position:sticky;top:0;z-index:10;background:#fff;border-bottom:4px solid var(--gold);
       display:flex;gap:10px;align-items:center;padding:10px 18px;box-shadow:0 2px 8px rgba(0,0,0,.08);}
  .bar b{color:var(--teal);font-size:18px;}
  .bar .sp{flex:1;}
  .bar a,.bar button{font:inherit;font-weight:700;border:2px solid var(--teal);background:#fff;color:var(--teal);
       border-radius:8px;padding:7px 12px;cursor:pointer;text-decoration:none;}
  .bar button.on{background:var(--teal);color:#fff;}
  .stage{display:flex;justify-content:center;padding:22px;}
  .stage object{width:100%;max-width:1180px;background:#fff;border:1px solid #cdd9db;border-radius:10px;
       box-shadow:0 10px 30px rgba(0,0,0,.12);}
  #board{aspect-ratio:1680/2620;}
  #slide{aspect-ratio:2560/1440;display:none;}
  .hint{color:#5e7479;font-size:13px;}
</style>
</head>
<body>
  <div class="bar">
    <b>One-Sample t-Test · The Cupcake Audit</b>
    <span class="hint">Open the SVGs full-screen to teach from · slide also exported to .pptx</span>
    <span class="sp"></span>
    <button id="bBoard" class="on" onclick="show('board')">Board (poster)</button>
    <button id="bSlide" onclick="show('slide')">Slide (16:9)</button>
    <a href="cupcake_t_test_board.svg" target="_blank">Board SVG ↗</a>
    <a href="cupcake_t_test_slide.svg" target="_blank">Slide SVG ↗</a>
    <a href="cupcake_t_test_slide.pptx">Download .pptx ↓</a>
  </div>
  <div class="stage">
    <object id="board" data="cupcake_t_test_board.svg" type="image/svg+xml"></object>
    <object id="slide" data="cupcake_t_test_slide.svg" type="image/svg+xml"></object>
  </div>
<script>
  function show(which){
    document.getElementById('board').style.display = which==='board'?'block':'none';
    document.getElementById('slide').style.display = which==='slide'?'block':'none';
    document.getElementById('bBoard').classList.toggle('on', which==='board');
    document.getElementById('bSlide').classList.toggle('on', which==='slide');
  }
</script>
</body>
</html>
